[package]
name = "prvds-game-launcher"
description = "PRVDS Game Launcher"
authors = ["PRVDS"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "prvds_game_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core = { path = "../crates/launcher-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
dirs = "6"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }
