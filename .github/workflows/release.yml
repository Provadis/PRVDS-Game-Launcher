name: Windows installer

# Dev builds: every push to dev (and manual runs)
#   -> PRVDS-Game-Launcher_<version>-dev.<run>_x64-setup.exe
#   -> on dev: published as the rolling pre-release "dev-latest" (update channel "Dev")
# Releases: a tag v<version> (set on main)
#   -> PRVDS-Game-Launcher_<version>_x64-setup.exe and .msi
#   -> published as GitHub Release v<version> (update channel "Stabil")
# The version itself lives in package.json (see scripts/version.mjs).
#
# Signed updates need, in the repository settings:
#   secret   TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
#   variable TAURI_UPDATER_PUBKEY
# Without them the installers are still built, but nothing is published.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ["v*"]

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Baked into the app at compile time (src-tauri/src/updates.rs).
      PRVDS_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Work out version
        id: ver
        run: |
          node scripts/version.mjs check
          base=$(node scripts/version.mjs)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::Tag v$tag does not match version $base in package.json"
              exit 1
            fi
            version="$base"
            echo "bundles=nsis,msi" >> "$GITHUB_OUTPUT"
            echo "release=v$base" >> "$GITHUB_OUTPUT"
          else
            # MSI only takes numeric versions, so dev builds are setup.exe only.
            version=$(node scripts/version.mjs dev "$GITHUB_RUN_NUMBER")
            echo "bundles=nsis" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/heads/dev ]]; then
              echo "release=dev-latest" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$PRVDS_UPDATER_PUBKEY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            # The CLI checks the signature against plugins.updater.pubkey, which
            # is empty in tauri.conf.json, so the key goes in here as well.
            config=$(node -e 'console.log(JSON.stringify({version: process.argv[1], bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.PRVDS_UPDATER_PUBKEY.trim()}}}))' "$version")
            echo "config=$config" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No update signing key configured: building unsigned, nothing gets published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "config={\"version\":\"$version\"}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ steps.ver.outputs.version }}
        run: npx tauri build --bundles ${{ steps.ver.outputs.bundles }} --config '${{ steps.ver.outputs.config }}'

      - name: Name the installers
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist-installer
          for f in target/release/bundle/nsis/*.exe; do
            cp "$f" "dist-installer/PRVDS-Game-Launcher_${v}_x64-setup.exe"
            [[ -e "$f.sig" ]] && cp "$f.sig" "dist-installer/PRVDS-Game-Launcher_${v}_x64-setup.exe.sig"
          done
          for f in target/release/bundle/msi/*.msi; do
            [[ -e "$f" ]] && cp "$f" "dist-installer/PRVDS-Game-Launcher_${v}_x64.msi"
          done
          ls -l dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: PRVDS-Game-Launcher_${{ steps.ver.outputs.version }}
          path: dist-installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: steps.ver.outputs.signed == 'true' && steps.ver.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          setup="PRVDS-Game-Launcher_${VERSION}_x64-setup.exe"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/${setup}"
          if [[ "$RELEASE" == dev-latest ]]; then
            notes="Dev-Build ${VERSION} vom Stand ${GITHUB_SHA::7}. Kann Fehler enthalten."
          else
            notes="Version ${VERSION}. Alle Änderungen stehen im Release auf GitHub."
          fi
          SIG_FILE="dist-installer/${setup}.sig" URL="$url" NOTES="$notes" node -e '
            const fs = require("fs");
            fs.writeFileSync("dist-installer/latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: process.env.NOTES,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(),
                url: process.env.URL,
              } },
            }, null, 2));
          '
          cat dist-installer/latest.json
          files=(dist-installer/*.exe dist-installer/latest.json)
          [[ -e "dist-installer/PRVDS-Game-Launcher_${VERSION}_x64.msi" ]] && files+=("dist-installer/PRVDS-Game-Launcher_${VERSION}_x64.msi")
          if [[ "$RELEASE" == dev-latest ]]; then
            # One rolling pre-release that always holds the newest dev build.
            gh release delete dev-latest --yes --cleanup-tag || true
            gh release create dev-latest "${files[@]}" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Dev-Build ${VERSION}" --notes "$notes"
          else
            gh release create "$RELEASE" "${files[@]}" --verify-tag --latest \
              --title "${VERSION}" --generate-notes
          fi
